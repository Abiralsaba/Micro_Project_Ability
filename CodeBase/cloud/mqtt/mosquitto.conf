# Mosquitto MQTT Broker Configuration — Project Ability Cloud Relay
# Place this file at /etc/mosquitto/conf.d/ability.conf on your VPS

# ── Listener (TLS only — no unencrypted connections) ─────────
listener 8883
protocol mqtt

# ── TLS Configuration ────────────────────────────────────────
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.3

# ── Authentication ───────────────────────────────────────────
allow_anonymous false
password_file /etc/mosquitto/passwd

# ── Access Control ───────────────────────────────────────────
# Each hub can only publish/subscribe to its own topics
acl_file /etc/mosquitto/acl

# ── Persistence (for offline message queuing) ────────────────
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

# ── QoS 2 Support ───────────────────────────────────────────
max_inflight_messages 20
max_queued_messages 1000

# ── Logging ──────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Connection Limits ────────────────────────────────────────
max_connections 100
